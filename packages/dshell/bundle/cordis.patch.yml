# dshell bundle patch — applied on top of the dsh `web` profile.
# Run with: dsh web --patch ./packages/dshell/bundle/cordis.patch.yml
#
# Each dshell-* package below is a Cordis row the bundle brings into the
# active composition. The web profile is the dsh-web-app bundle; this
# patch layer sits above it, so rows here override base/web by id.
#
# This file is the single install point for dshell: enabling dshell in a
# dsh deployment means adding one --patch flag with this file's path.

# ── host half: terminal capability ─────────────────────────────────────
# dsh ships the `web` profile with bash + sandbox already configured,
# so dshell reuses the existing terminal/sandbox rows and only inserts
# its own plugin packages. Each dshell-* row uses a fresh id so it does
# not collide with a shipped tooling id.

- insert:
    # PTY service; this id is distinct from any shipped web-profile row, so it
    # coexists with the existing tools.
    - id: dshell-terminal
      name: '@deepseek-ai/dsh-terminal'

    # NOTE: no terminal-bash row on purpose. dshell's bridge registers its raw
    # PTY backend under the type `shell` — the name dsh's persistent shell
    # tools resolve by default (`backendType` defaults to `'shell'`) — so any
    # composition whose persistent shell group does NOT isolate the terminals
    # realm resolves the bridge's backend and its bash lands on the agent's
    # watched terminal. A terminal-bash row here would race the bridge for the
    # same backend name and fail loud at boot (DUPLICATE_BACKEND).

    - id: dshell-tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'

    # Browser half of the `terminal` Conversation target.
    - id: dshell-conversation
      name: '@nexus-aethra/dshell-conversation'

    # Browser↔host PTY wire bridge.
    - id: dshell-terminal-bridge
      name: '@nexus-aethra/dshell-terminal-bridge'

    # Composer mode toggle and prefix handling.
    - id: dshell-mode
      name: '@nexus-aethra/dshell-mode'

    # /new on ctx.commands, plus the agent-terminal model tools
    # (dshell_get_agent_terminal, dshell_terminal_read, dshell_terminal_output).
    - id: dshell-commands
      name: '@nexus-aethra/dshell-commands'

    # Workspace removal (design 4.7): stub providers for the disabled
    # stock rows below, plus the flat session list for the sidebar.
    - id: dshell-workspace
      name: '@nexus-aethra/dshell-workspace'

    # SSH devices: durable device/key registry, per-session assignment, and
    # routing of a bound session's shell commands to that device.
    - id: dshell-ssh
      name: '@nexus-aethra/dshell-ssh'

    # Cross-session pipe: user-established links between sessions, deferred
    # requests one agent hands to another, scoped revocable folder grants, and
    # the watchdog that guarantees the requester is always woken.
    - id: dshell-buffer
      name: '@nexus-aethra/dshell-buffer'

    # Right-sidebar file navigator: takes over the `files` tab kind (dsh's
    # registry keeps one builtin and one extension per kind, and the extension
    # is the one in force) so the pane can walk — `..`, clickable crumbs,
    # back/forward — through the session's own execution world.
    - id: dshell-files
      name: '@nexus-aethra/dshell-files'

    # Browser use. dsh ships the registry and the providers separately; dshell
    # fills the registry's exclusive slot with its own provider instead of the
    # stock Playwright one, because a session bound to an SSH device must get no
    # browser at all and a browser that cannot start must cost the session
    # nothing. Both reasons are in that package's module doc.
    - id: dshell-browser-use-registry
      name: '@deepseek-ai/dsh-browser-use'
    - id: dshell-host-tools
      name: '@nexus-aethra/dshell-host-tools'

    # Computer use: the desktop this harness runs on, driven by the agent. The
    # registry and the provider are upstream's unchanged — the provider
    # registers its catalog globally, so dshell takes it away from device
    # sessions with a per-agent deny list instead of a mount it can skip.
    - id: dshell-computer-use-registry
      name: '@deepseek-ai/dsh-computer-use'
    - id: dshell-computer-use-cua-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'

# ── workspace removal (design 4.7) ────────────────────────────────────
# dshell has no use for dsh's directory-workspace grouping: a terminal's
# workspace is its current directory. Two of the four stock web-app rows are
# disabled here — `workspace` (the registry) and `ui-workspace` (the grouped
# browser) — and dshell-workspace provides same-key stand-ins (host
# `workspaceRegistry`, client `uiWorkspace` + root hook) so session-controller
# and ui-conversation/ui-sidebar still resolve. Sessions are created by cwd
# instead; see docs/dshell-design.md § 4.7.
#
# `workspace-controller` is ENABLED. It is the row that turns
# `workspaceRegistry.archiveSession` / `unarchiveSession` into the remote
# commands the client's `workspaces` service is written against, and it is what
# makes dsh's own `ui-settings-unarchive-sessions` page — which this profile
# renders — show and restore a real set. dshell therefore keeps no archive UI of
# its own: the sidebar's 归档 button is the only writer, and the settings page
# is the reader and the restore surface.
#
# This row used to take the whole client down ("Failed to load plugins"), and
# the cause was OURS, not upstream's: dshell-workspace registered a
# `workspaces` stand-in, and `WorkspaceController` does `super(ctx, 'workspaces')`
# — two providers for one service key is a cordis error, and it surfaced only
# as a failed fiber. The stand-in is gone (see
# packages/dshell/workspace/src/client/index.ts); the registry's archive half is
# real now, so nothing needs standing in for. An earlier suspicion — that the
# row's manifest inject (`['@deepseek-ai/dsh-api-gateway',
# '@deepseek-ai/dsh-client-connection']`) disagreed with its code inject
# (`['remote', 'remote.workspace']`) — was wrong: that split is stock
# throughout and `terminal-controller` has it too.
#
# The registry stand-in serves only the ARCHIVE half for real. Its workspace
# half stays the honest projection of a shell without workspaces, which is also
# why upstream's `WorkspaceRegistry` is not hosted here: its one-time
# `bootstrap()` groups stored session headers by cwd and would rebuild exactly
# the accounting design 4.7 removed — on a fresh profile, where nothing has
# seeded the initialized marker. dshell sessions belong to no workspace, and
# upstream's archive set does not require them to: `archiveSession` checks that
# a session EXISTS, never that it is accounted for.
#
# The filesystem provider is dshell's own. `ctx.fs` has exactly one provider,
# and dshell's takes the stock backend's place (extending it) so a session
# bound to a device has its file operations — read, write, edit, list — run on
# that device instead of this machine. The local half of every call is the
# stock implementation verbatim; see packages/dshell/ssh/src/fs-routing.ts.
- id: fs-sandbox
  disabled: true

- id: workspace
  disabled: true
- id: directory-picker
  disabled: true
- id: ui-workspace
  disabled: true

# ── the view tab strip ─────────────────────────────────────────────────
# dsh shows the conversation view tabs as soon as more than one view is
# registered, and it builds that list from the RAW slot entries rather than
# the shadowed ones — so a shadowing registration appears as a second tab
# instead of replacing the first. dshell's block view already shadows
# `ui-chat`'s `chat` entry for rendering; disabling the stock row is what
# stops it from also contributing a duplicate tab, leaving the strip with
# exactly two: `会话` (dshell's block view) and `轨迹` (ui-trajectory).
#
# The two child slots ui-chat declared go with it: `conversation.chat.node`
# and `conversation.message.images`. Nothing is lost — dshell's view renders
# neither, so `ui-goal`, `ui-workflow-run` and `ui-attachment` simply never
# get asked to draw into them (the `slots.inject` wait for a declaration that
# never arrives, which is silent by design).
- id: ui-chat
  disabled: true

# ── background jobs header widget ──────────────────────────────────────
# The stock session-header jobs dropdown renders the same jobsBySession
# mirror the status card reads. The card now carries the jobs as its
# 后台任务 row (live count in the headline, per-job detail expanded), so
# a second control for the same data in the header goes. Disabling the
# row removes only the header widget — the data lives in the session
# store either way.
- id: ui-jobs
  disabled: true

# ── default agent preset ────────────────────────────────────────────────────
# No override and no dshell preset. The stock presets own their shell stacks
# behind deliberate isolation (tool-bash via the single-provider `ctx.shell`,
# persistent-bash inside an `isolate: terminals` realm), so no plugin can — or
# should — rewire them. They already satisfy dshell's one hard requirement on
# their own: the model's commands run in fresh sandboxed processes and never
# occupy the user's terminal, while the block view keeps every tool call
# visible and the stop affordance keeps it controllable. New sessions follow
# dsh's default (standard); the user picks any of the shipped modes freely.

# ── dev-only hot reload (skip in non-dev sessions) ─────────────────────
# dsh's web profile mounts @deepseek-ai/dsh-client-hmr as a client
# roster row that stays idle until a `pnpm run dev:web` rebuild watcher
# rewrites client bundles. The row stays in the roster even when no
# watcher runs, which makes the client bundle loader look up `/plugins/
# ...dsh-client-hmr/client.js` at boot; without a rebuild watcher the
# file may not exist, blocking the entire client bundle. Disabling the
# row by re-asserting it with `disabled: true` removes it from the
# client roster without touching dsh source.
- id: client-hmr
  disabled: true